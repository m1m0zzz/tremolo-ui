# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: test & build

on:
  push:
    branches: [ "main" ]
    paths: &build-paths
      # ドキュメントサイトと Storybook もここでビルドするので、site/ の変更は
      # このワークフローの結果に影響する。除外するのは site の外の .md
      # （README / plans/ / .changeset/）だけ。
      #
      # paths-ignore では `!` による除外解除が使えないため paths + `!` を使う。
      # 後に書いたパターンが勝つので、順序を入れ替えないこと。`site/**` が
      # 最後にあることで、site 配下の .md だけが除外から戻る。
      # アンカーで push / pull_request に同じリストを配る（Actions は 2025-09 から
      # アンカーとエイリアスに対応。merge key `<<:` だけは使えない）。
      #
      # NOTE: main に branch protection を入れて build を必須チェックにすると、
      # ここでスキップされた PR はチェックが Pending のまま残りマージ不能になる。
      # そのときは同名の no-op job を用意すること。
      - '**'
      - '!**.md'
      - 'site/**'
  pull_request:
    # NOTE: stacked PR の中段（base が main 以外）は、GitHub がスタックとして
    # 認識した後のイベントなら base を main として扱うので、この指定でも走る。
    # ただし gh stack submit は PR を作ってからスタックにまとめるため、
    # opened の時点ではまだスタックが無く、そこだけ取りこぼす。
    branches: [ "main" ]
    paths: *build-paths

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      with:
        node-version-file: '.nvmrc'
        cache: 'npm'

    # Ensure npm 11.10. or later for min-release-age support
    - run: npm install -g npm@latest

    - name: Install dependencies
      run: npm ci

    # packages/react のテストは workspace symlink 越しに他パッケージの dist を
    # 解決するため、テストより先にビルドする必要がある。site と Storybook も
    # 同じ symlink 越しに dist を見るので、この 1 回で全部が揃う。
    - name: Build packages
      run: npm run build:package

    - name: Test
      run: npm run test

    # ルートの build:sb / build:docs は build:package を含むが、ここでは
    # 済んでいるので workspace のスクリプトを直接呼ぶ。
    - name: Build Storybook
      run: npm run build:sb -w packages/react

    # docusaurus build は i18n.locales の全ロケール（en / ja）を出す。
    # COMMIT_SHA は任意で、未設定なら GitHubLink がリビジョン指定を省く。
    - name: Build docs site
      run: npm run build -w site
