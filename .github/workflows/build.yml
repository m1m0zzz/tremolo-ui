# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: test & package build

on:
  push:
    branches: [ "main" ]
    paths: &build-paths
      # このワークフローが回すのは build:package と test だけで、どちらも
      # `--workspaces --if-present`。site にはそのどちらのスクリプトも無いので、
      # site/ の変更はこのワークフローの結果に一切影響しない。
      # ただし site/package.json は npm ci の解決結果を変えうるので対象に残す。
      #
      # paths-ignore では `!` による除外解除が使えないため paths + `!` を使う。
      # 後に書いたパターンが勝つので、順序を入れ替えないこと。
      # アンカーで push / pull_request に同じリストを配る（Actions は 2025-09 から
      # アンカーとエイリアスに対応。merge key `<<:` だけは使えない）。
      #
      # NOTE: main に branch protection を入れて build を必須チェックにすると、
      # ここでスキップされた PR はチェックが Pending のまま残りマージ不能になる。
      # そのときは同名の no-op job を用意すること。
      - '**'
      - '!**.md'
      - '!site/**'
      - 'site/package.json'
  pull_request:
    branches: [ "main" ]
    paths: *build-paths

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      with:
        node-version-file: '.nvmrc'
        cache: 'npm'

    # Ensure npm 11.10. or later for min-release-age support
    - run: npm install -g npm@latest

    - name: Install dependencies
      run: npm ci

    # packages/react のテストは workspace symlink 越しに他パッケージの dist を
    # 解決するため、テストより先にビルドする必要がある
    - name: Build packages
      run: npm run build:package

    - name: Test
      run: npm run test
