name: Release package

on:
  push:
    branches: [ "main" ]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # version PR のコミットとタグの作成に必要
      pull-requests: write  # "Version Packages" PR の作成に必要
      id-token: write       # npm trusted publishing (OIDC)

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      with:
        node-version-file: '.nvmrc'
        cache: 'npm'
        registry-url: 'https://registry.npmjs.org'

    # 他のワークフローと同じ理由（engines.npm）。trusted publishing にも
    # 11.5.1 以降が要る（未満だと OIDC 失敗時に E404 という紛らわしいエラーになる）
    - run: npm install -g npm@12

    - name: Install dependencies
      run: npm ci

    # packages/react のテストは workspace symlink 越しに @tremolo-ui/functions の dist を
    # 解決するため、テストより先にビルドする必要がある
    - name: Build packages
      run: npm run build:package

    - name: Test
      run: npm run test

    # changeset がある場合は "Version Packages" PR を作成/更新し、
    # その PR が main にマージされた時点で publish-script が走る
    - name: Create Release PR or Publish
      uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
      with:
        publish-script: npm run release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
