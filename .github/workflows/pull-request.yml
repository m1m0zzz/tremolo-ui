name: Pull Request

on:
  pull_request:
    # base を絞らないのは stacked PR のため。中段の PR は base が main では
    # ないので、branches: [main] を書くと拾えないことがある
    paths:
      - '**'
      - '!**.md'
      - 'site/**'
      # Vercel 時代の URL を飛ばすだけの静的ファイル。ビルドにもテストにも
      # 関わらない（vercel-redirect/README.md）。
      - '!vercel-redirect/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # preview URL の sticky comment を貼るため
      pull-requests: write

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      with:
        node-version-file: '.nvmrc'
        cache: 'npm'

    # npm 12 を同梱する Node はまだ無い。.npmrc の設定が npm 11.16 以降でしか
    # 効かないため engines.npm で弾いており、入れ忘れると npm ci が EBADENGINE で落ちる
    - run: npm install -g npm@12

    - run: npm ci

    - run: npm run lint
    - run: npm run format:check

    # テーマはテンプレートにもコピーしてある（degit で取り出したテンプレートが単体で
    # 動くように）。正本は shared/css なので、ずれていたら落とす。
    - name: Check template themes
      run: |
        for f in templates/*/src/theme/*.module.css; do
          cmp "$f" "shared/css/$(basename "$f")"
        done

    # packages/react のテストは workspace symlink 越しに他パッケージの dist を
    # 解決するため、テストより先にビルドする必要がある。site と Storybook も
    # 同じ symlink 越しに dist を見るので、この 1 回で全部が揃う。
    - run: npm run build:package

    - run: npm run test

    # テンプレートは workspaces に入っているので、@tremolo-ui/* は手元の dist に
    # symlink される。ここで落ちるのは、テンプレートが追随していない破壊的変更。
    - name: Build templates
      run: npm run build -w templates/vite-react-ts -w templates/next-ts

    - run: npm run build:sb -w packages/react -w packages/svelte -w packages/vue

    - run: npm run build -w site

    # fork からの PR には secrets が渡らないので丸ごと落ちる。
    # preview は Cloudflare Access で塞ぐ方針なのでどのみち外部の人は見られず、
    # そのために pull_request_target を使うことはしない。
    - name: Compute preview alias
      id: preview
      if: ${{ !github.event.pull_request.head.repo.fork }}
      env:
        BRANCH: ${{ github.head_ref }}
      run: |
        # alias に使えるのは小文字・数字・ハイフンのみで、先頭は小文字。
        # さらに alias + Worker 名が 63 文字以内（DNS の制約）。一番長い
        # tremolo-ui-sb-svelte が 20 文字 + ハイフンなので 42 文字で切る。
        alias=$(printf '%s' "$BRANCH" \
          | tr '[:upper:]' '[:lower:]' \
          | tr -cs 'a-z0-9' '-' \
          | cut -c1-42 \
          | sed 's/^-*//; s/-*$//')
        case "$alias" in
          [a-z]*) ;;
          *) alias="pr-${{ github.event.number }}" ;;
        esac
        echo "alias=$alias" >> "$GITHUB_OUTPUT"

    # Worker ごとにステップを分け、1 つが落ちても残りは上げる。コメントも行ごとに
    # 結果を出す。落ちたことは最後のステップでジョブの失敗にする。
    - name: Upload docs preview
      id: upload-docs
      if: ${{ !github.event.pull_request.head.repo.fork }}
      continue-on-error: true
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        ALIAS: ${{ steps.preview.outputs.alias }}
      run: npx wrangler versions upload --config site/wrangler.jsonc --preview-alias "$ALIAS"

    - name: Upload Storybook (React) preview
      id: upload-react
      if: ${{ !github.event.pull_request.head.repo.fork }}
      continue-on-error: true
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        ALIAS: ${{ steps.preview.outputs.alias }}
      run: npx wrangler versions upload --config packages/react/wrangler.jsonc --preview-alias "$ALIAS"

    - name: Upload Storybook (Svelte) preview
      id: upload-svelte
      if: ${{ !github.event.pull_request.head.repo.fork }}
      continue-on-error: true
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        ALIAS: ${{ steps.preview.outputs.alias }}
      run: npx wrangler versions upload --config packages/svelte/wrangler.jsonc --preview-alias "$ALIAS"

    - name: Upload Storybook (Vue) preview
      id: upload-vue
      if: ${{ !github.event.pull_request.head.repo.fork }}
      continue-on-error: true
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        ALIAS: ${{ steps.preview.outputs.alias }}
      run: npx wrangler versions upload --config packages/vue/wrangler.jsonc --preview-alias "$ALIAS"

    - name: ステータスとタイムスタンプを算出
      if: always()
      id: status
      shell: bash
      env:
        DOCS: ${{ steps.upload-docs.outcome }}
        REACT: ${{ steps.upload-react.outcome }}
        SVELTE: ${{ steps.upload-svelte.outcome }}
        VUE: ${{ steps.upload-vue.outcome }}
      run: |
        status() {
          case "$1" in
            success)   echo "✅ Success"   ;;
            cancelled) echo "⚠️ Cancelled" ;;
            *)         echo "❌ Failed"    ;;
          esac
        }
        TIMESTAMP=$(TZ=Asia/Tokyo date '+%Y/%m/%d %H:%M')
        RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        {
          echo "docs=$(status "$DOCS")"
          echo "react=$(status "$REACT")"
          echo "svelte=$(status "$SVELTE")"
          echo "vue=$(status "$VUE")"
          echo "timestamp=${TIMESTAMP}"
          echo "run_url=${RUN_URL}"
        } >> "$GITHUB_OUTPUT"

    - name: Comment preview URLs
      if: ${{ always() && !github.event.pull_request.head.repo.fork }}
      uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
      with:
        header: preview
        skip_unchanged: true
        message: |
          | Preview URL | Status | Timestamp (JST) |
          |---|---|---|
          | ${{ steps.upload-docs.outcome == 'success' && format('[Docs](https://{0}-tremolo-ui-docs.{1}.workers.dev/)', steps.preview.outputs.alias, vars.CLOUDFLARE_WORKERS_SUBDOMAIN) || 'Docs' }} | [${{ steps.status.outputs.docs }}](${{ steps.status.outputs.run_url }}) | ${{ steps.status.outputs.timestamp }} |
          | ${{ steps.upload-react.outcome == 'success' && format('[Storybook (React)](https://{0}-tremolo-ui-sb-react.{1}.workers.dev/i/storybook-react/)', steps.preview.outputs.alias, vars.CLOUDFLARE_WORKERS_SUBDOMAIN) || 'Storybook (React)' }} | [${{ steps.status.outputs.react }}](${{ steps.status.outputs.run_url }}) | ${{ steps.status.outputs.timestamp }} |
          | ${{ steps.upload-svelte.outcome == 'success' && format('[Storybook (Svelte)](https://{0}-tremolo-ui-sb-svelte.{1}.workers.dev/i/storybook-svelte/)', steps.preview.outputs.alias, vars.CLOUDFLARE_WORKERS_SUBDOMAIN) || 'Storybook (Svelte)' }} | [${{ steps.status.outputs.svelte }}](${{ steps.status.outputs.run_url }}) | ${{ steps.status.outputs.timestamp }} |
          | ${{ steps.upload-vue.outcome == 'success' && format('[Storybook (Vue)](https://{0}-tremolo-ui-sb-vue.{1}.workers.dev/i/storybook-vue/)', steps.preview.outputs.alias, vars.CLOUDFLARE_WORKERS_SUBDOMAIN) || 'Storybook (Vue)' }} | [${{ steps.status.outputs.vue }}](${{ steps.status.outputs.run_url }}) | ${{ steps.status.outputs.timestamp }} |

          *このコメントは新しいコミットごとに更新されます。*

    # continue-on-error で先へ進めたアップロードの失敗を、ここでジョブの失敗にする。
    - name: Fail if a preview upload failed
      if: >-
        steps.upload-docs.outcome == 'failure' ||
        steps.upload-react.outcome == 'failure' ||
        steps.upload-svelte.outcome == 'failure' ||
        steps.upload-vue.outcome == 'failure'
      run: |
        echo "::error::A preview upload failed. See the upload steps."
        exit 1
